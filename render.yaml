# ══════════════════════════════════════════════════════════════
# JanSathi AI — Render Blueprint
# ══════════════════════════════════════════════════════════════
# This file defines the infrastructure for deploying both the
# backend (Express + Prisma) and frontend (Next.js) on Render.
#
# Usage:
#   1. Go to https://dashboard.render.com/blueprints
#   2. Click "New Blueprint Instance"
#   3. Connect your GitHub repo
#   4. Fill in the prompted environment variables
#   5. Click "Apply"
# ══════════════════════════════════════════════════════════════

services:
  # ── Backend (Express + Prisma + TypeScript) ────────────────
  - type: web
    name: jansathi-backend
    plan: free
    runtime: node
    rootDir: backend

    # Build: install ALL deps, generate Prisma client, compile TS.
    # We use explicit ./node_modules/.bin paths because Render's sh
    # sometimes fails to resolve npx binaries (Permission denied).
    buildCommand: "npm install && node ./node_modules/.bin/prisma generate && ./node_modules/.bin/tsc"
    startCommand: node dist/index.js

    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: ADMIN_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        value: "https://jansathi-frontend.onrender.com"

  # ── Frontend (Next.js) ─────────────────────────────────────
  - type: web
    name: jansathi-frontend
    plan: free
    runtime: node
    rootDir: frontend

    buildCommand: npm install && npm run build
    startCommand: npm start

    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: "https://jansathi-backend.onrender.com"
      - key: NEXT_PUBLIC_ADMIN_SECRET
        sync: false
