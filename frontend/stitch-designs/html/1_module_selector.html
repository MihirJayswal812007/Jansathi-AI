<!DOCTYPE html>
<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>JanSathi AI - Voice-First Module Selector</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#2563EB", // Blue for JanSeva/Active state
                        "background-light": "#f6f6f8",
                        "background-dark": "#0a0a1a", // Deep dark requested
                        "card-dark": "#16162c",
                        "border-dark": "#2a2a45",
                    },
                    fontFamily: {
                        sans: ["Public Sans", "sans-serif"],
                        display: ["Public Sans", "sans-serif"],
                    },
                    animation: {
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'ripple': 'ripple 2s infinite',
                    },
                    keyframes: {
                        ripple: {
                            '0%': { transform: 'scale(1)', opacity: '0.4' },
                            '100%': { transform: 'scale(2.5)', opacity: '0' },
                        }
                    }
                },
            },
        }
    </script>
<style>.glass-card {
            background: rgba(22, 22, 44, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glow-orb {
            background: radial-gradient(circle at center, rgba(124, 58, 237, 0.4) 0%, rgba(37, 99, 235, 0.1) 50%, transparent 70%);
            filter: blur(40px);
        }
        .neon-border-blue:hover {
            box-shadow: 0 0 15px rgba(37, 99, 235, 0.3);
            border-color: rgba(37, 99, 235, 0.5);
        }
        .neon-border-purple:hover {
            box-shadow: 0 0 15px rgba(124, 58, 237, 0.3);
            border-color: rgba(124, 58, 237, 0.5);
        }
        .neon-border-green:hover {
            box-shadow: 0 0 15px rgba(5, 150, 105, 0.3);
            border-color: rgba(5, 150, 105, 0.5);
        }
        .neon-border-amber:hover {
            box-shadow: 0 0 15px rgba(217, 119, 6, 0.3);
            border-color: rgba(217, 119, 6, 0.5);
        }
        .neon-border-red:hover {
            box-shadow: 0 0 15px rgba(220, 38, 38, 0.3);
            border-color: rgba(220, 38, 38, 0.5);
        }.mic-glow {
            box-shadow: 0 0 0 0 rgba(37, 99, 235, 0.7);
            animation: pulse-blue 2s infinite;
        }
        @keyframes pulse-blue {
            0% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(37, 99, 235, 0.7);
            }
            70% {
                transform: scale(1);
                box-shadow: 0 0 0 20px rgba(37, 99, 235, 0);
            }
            100% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(37, 99, 235, 0);
            }
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 font-display min-h-screen flex overflow-hidden">
<aside class="w-[260px] h-screen flex flex-col border-r border-border-dark bg-[#0a0a1a] shrink-0 z-20 hidden lg:flex">
<div class="p-6 flex items-center gap-3">
<div class="h-10 w-10 rounded-xl bg-gradient-to-br from-primary to-purple-600 flex items-center justify-center shadow-lg shadow-primary/20">
<span class="material-symbols-outlined text-white">smart_toy</span>
</div>
<div class="flex flex-col">
<h1 class="text-white text-lg font-bold leading-none tracking-tight">JanSathi AI</h1>
<p class="text-slate-400 text-xs font-medium mt-1">Gov Assist Platform</p>
</div>
</div>
<nav class="flex-1 px-4 py-4 flex flex-col gap-2">
<a class="flex items-center gap-3 px-4 py-3 rounded-xl bg-primary text-white shadow-lg shadow-primary/25 transition-all" href="#">
<span class="material-symbols-outlined filled">chat_bubble</span>
<span class="text-sm font-medium">Chat</span>
</a>
<a class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-400 hover:text-white hover:bg-white/5 transition-colors group" href="#">
<span class="material-symbols-outlined group-hover:scale-110 transition-transform">grid_view</span>
<span class="text-sm font-medium">Dashboard</span>
</a>
<a class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-400 hover:text-white hover:bg-white/5 transition-colors group" href="#">
<span class="material-symbols-outlined group-hover:scale-110 transition-transform">history</span>
<span class="text-sm font-medium">History</span>
</a>
<a class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-400 hover:text-white hover:bg-white/5 transition-colors group" href="#">
<span class="material-symbols-outlined group-hover:scale-110 transition-transform">person</span>
<span class="text-sm font-medium">Profile</span>
</a>
<a class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-400 hover:text-white hover:bg-white/5 transition-colors group" href="#">
<span class="material-symbols-outlined group-hover:scale-110 transition-transform">settings</span>
<span class="text-sm font-medium">Settings</span>
</a>
<a class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-400 hover:text-white hover:bg-white/5 transition-colors group" href="#">
<span class="material-symbols-outlined group-hover:scale-110 transition-transform">help</span>
<span class="text-sm font-medium">Help</span>
</a>
</nav>
<div class="p-4 border-t border-border-dark flex flex-col gap-2">
<button class="flex items-center gap-3 px-4 py-2 rounded-xl text-slate-400 hover:text-white hover:bg-white/5 transition-colors w-full text-left">
<span class="material-symbols-outlined">language</span>
<span class="text-sm font-medium">Language (EN)</span>
</button>
<button class="flex items-center gap-3 px-4 py-2 rounded-xl text-red-400 hover:text-red-300 hover:bg-red-500/10 transition-colors w-full text-left">
<span class="material-symbols-outlined">logout</span>
<span class="text-sm font-medium">Logout</span>
</button>
</div>
</aside>
<main class="flex-1 relative flex flex-col lg:flex-row h-screen overflow-hidden">
<div class="absolute inset-0 bg-[#0a0a1a] z-0">
<div class="absolute top-[-20%] left-[-10%] w-[600px] h-[600px] bg-primary/10 rounded-full blur-[120px]"></div>
<div class="absolute bottom-[-20%] right-[-10%] w-[500px] h-[500px] bg-purple-600/10 rounded-full blur-[100px]"></div>
</div>
<div class="relative z-10 w-full lg:w-[45%] flex flex-col justify-center items-center lg:items-start p-8 lg:p-16">
<div class="mb-16 text-center lg:text-left w-full">
<h1 class="text-4xl lg:text-5xl font-bold text-white mb-3 tracking-tight">Good Morning 👋</h1>
<p class="text-xl text-slate-400 font-light">How can I help you today?</p>
</div>
<div class="relative w-full flex flex-col items-center justify-center mb-10">
<div class="absolute w-[200px] h-[200px] bg-primary/20 rounded-full animate-ripple"></div>
<div class="absolute w-[160px] h-[160px] bg-primary/30 rounded-full animate-ripple" style="animation-delay: 0.5s;"></div>
<button class="relative z-20 w-24 h-24 rounded-full bg-gradient-to-b from-primary to-blue-600 flex items-center justify-center mic-glow hover:scale-105 transition-transform duration-300 cursor-pointer shadow-[0_0_40px_rgba(37,99,235,0.5)] border-4 border-[#0a0a1a]">
<span class="material-symbols-outlined text-white text-5xl">mic</span>
</button>
<p class="mt-8 text-slate-400 text-lg font-medium tracking-wide">Tap to speak</p>
</div>
<div class="mt-auto lg:mt-12 w-full flex justify-center lg:justify-start">
<div class="px-6 py-3 rounded-full bg-white/5 border border-white/10 backdrop-blur-md flex items-center gap-3">
<span class="relative flex h-3 w-3">
<span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
<span class="relative inline-flex rounded-full h-3 w-3 bg-green-500"></span>
</span>
<span class="text-sm font-medium text-slate-300">System Operational • Rural Connect v2.1</span>
</div>
</div>
</div>
<div class="relative z-10 w-full lg:w-[55%] h-full flex flex-col justify-center p-8 lg:p-16 overflow-y-auto bg-gradient-to-l from-transparent via-[#0a0a1a]/20 to-transparent">
<div class="max-w-[640px] w-full mx-auto">
<div class="flex items-center gap-3 mb-8">
<span class="h-px w-8 bg-primary"></span>
<h3 class="text-sm font-bold tracking-widest text-primary uppercase">Choose a Module to Get Started</h3>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
<button class="glass-card neon-border-blue group rounded-2xl p-6 flex flex-col items-start text-left transition-all duration-300 hover:-translate-y-1">
<div class="h-12 w-12 rounded-full bg-[#2563EB]/20 flex items-center justify-center mb-4 group-hover:bg-[#2563EB] transition-colors">
<span class="material-symbols-outlined text-[#2563EB] group-hover:text-white">account_balance</span>
</div>
<h4 class="text-white font-bold text-lg mb-1 group-hover:text-[#2563EB] transition-colors">JanSeva</h4>
<p class="text-slate-400 text-sm font-medium">Civic Connect</p>
<p class="text-slate-500 text-xs mt-3 leading-relaxed">Access government schemes and civic services.</p>
</button>
<button class="glass-card neon-border-purple group rounded-2xl p-6 flex flex-col items-start text-left transition-all duration-300 hover:-translate-y-1">
<div class="h-12 w-12 rounded-full bg-[#7C3AED]/20 flex items-center justify-center mb-4 group-hover:bg-[#7C3AED] transition-colors">
<span class="material-symbols-outlined text-[#7C3AED] group-hover:text-white">school</span>
</div>
<h4 class="text-white font-bold text-lg mb-1 group-hover:text-[#7C3AED] transition-colors">JanShiksha</h4>
<p class="text-slate-400 text-sm font-medium">Edu Mentor</p>
<p class="text-slate-500 text-xs mt-3 leading-relaxed">Personalized learning paths and resources.</p>
</button>
<button class="glass-card neon-border-green group rounded-2xl p-6 flex flex-col items-start text-left transition-all duration-300 hover:-translate-y-1">
<div class="h-12 w-12 rounded-full bg-[#059669]/20 flex items-center justify-center mb-4 group-hover:bg-[#059669] transition-colors">
<span class="material-symbols-outlined text-[#059669] group-hover:text-white">agriculture</span>
</div>
<h4 class="text-white font-bold text-lg mb-1 group-hover:text-[#059669] transition-colors">JanKrishi</h4>
<p class="text-slate-400 text-sm font-medium">Agri Advisor</p>
<p class="text-slate-500 text-xs mt-3 leading-relaxed">Crop advisory, weather, and market prices.</p>
</button>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-5 mt-5 max-w-[640px] md:w-2/3 lg:w-full mx-auto lg:px-[10%] xl:px-[12%]">
<button class="glass-card neon-border-amber group rounded-2xl p-6 flex flex-col items-start text-left transition-all duration-300 hover:-translate-y-1">
<div class="h-12 w-12 rounded-full bg-[#D97706]/20 flex items-center justify-center mb-4 group-hover:bg-[#D97706] transition-colors">
<span class="material-symbols-outlined text-[#D97706] group-hover:text-white">storefront</span>
</div>
<h4 class="text-white font-bold text-lg mb-1 group-hover:text-[#D97706] transition-colors">JanVyapar</h4>
<p class="text-slate-400 text-sm font-medium">Gram Market</p>
<p class="text-slate-500 text-xs mt-3 leading-relaxed">Local marketplace for rural products.</p>
</button>
<button class="glass-card neon-border-red group rounded-2xl p-6 flex flex-col items-start text-left transition-all duration-300 hover:-translate-y-1">
<div class="h-12 w-12 rounded-full bg-[#DC2626]/20 flex items-center justify-center mb-4 group-hover:bg-[#DC2626] transition-colors">
<span class="material-symbols-outlined text-[#DC2626] group-hover:text-white">rocket_launch</span>
</div>
<h4 class="text-white font-bold text-lg mb-1 group-hover:text-[#DC2626] transition-colors">JanKaushal</h4>
<p class="text-slate-400 text-sm font-medium">Skill Udaan</p>
<p class="text-slate-500 text-xs mt-3 leading-relaxed">Vocational training and job matching.</p>
</button>
</div>
</div>
</div>
</main>
</body></html>
